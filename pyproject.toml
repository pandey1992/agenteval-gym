[project]
name = "agenteval-gym"
version = "0.1.0"
description = "A local-first pytest toolkit for evaluating AI agents against stateful business workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["fastapi>=0.115,<1.0", "sqlalchemy>=2.0,<3.0", "uvicorn>=0.30,<1.0"]

[project.entry-points.pytest11]
agenteval_gym = "agenteval.pytest_plugin"

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenteval*"]
